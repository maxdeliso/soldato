name: Simple Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Build Release x64
      run: |
        msbuild Soldato.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:PlatformToolset=v143 `
          /p:WindowsTargetPlatformVersion=10.0 `
          /m `
          /verbosity:minimal

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: Soldato-Release-x64
        path: x64/Release/Soldato.exe
        retention-days: 30
