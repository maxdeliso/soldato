name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: x86
            configuration: Release
            arch: Win32
            runner: windows-latest
          - platform: x64
            configuration: Release
            arch: x64
            runner: windows-latest
          - platform: arm64
            configuration: Release
            arch: ARM64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update version with GitHub Actions build number
      id: version
      run: |
        .\scripts\update-version-github.ps1
        echo "version=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
        echo "display_version=$(git describe --tags --abbrev=0 2>$null | sed 's/^v//' || echo '1.0.0')" >> $env:GITHUB_OUTPUT
        echo "build_number=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2


    - name: Build ${{ matrix.platform }}
      run: |
        msbuild Soldato.sln `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.arch }} `
          /p:PlatformToolset=v143 `
          /p:WindowsTargetPlatformVersion=10.0 `
          /m `
          /v:minimal

    - name: Create release directory
      run: |
        mkdir release-${{ matrix.platform }}
        if ("${{ matrix.arch }}" -eq "Win32") {
          copy "x64\Release\Soldato.exe" "release-${{ matrix.platform }}\Soldato.exe"
        } elseif ("${{ matrix.arch }}" -eq "ARM64") {
          copy "ARM64\${{ matrix.configuration }}\Soldato.exe" "release-${{ matrix.platform }}\Soldato.exe"
        } else {
          copy "x64\${{ matrix.configuration }}\Soldato.exe" "release-${{ matrix.platform }}\Soldato.exe"
        }
        try { copy "Soldato\app.ico" "release-${{ matrix.platform }}\app.ico" } catch { Write-Host "app.ico not found, skipping" }
      shell: pwsh

    - name: Create ZIP archive
      run: |
        powershell Compress-Archive -Path "release-${{ matrix.platform }}\*" -DestinationPath "Soldato-${{ steps.version.outputs.display_version }}-${{ matrix.platform }}.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Soldato-${{ matrix.platform }}
        path: Soldato-${{ steps.version.outputs.display_version }}-${{ matrix.platform }}.zip
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update version with GitHub Actions build number
      id: version
      run: |
        .\scripts\update-version-github.ps1
        echo "version=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
        echo "display_version=$(git describe --tags --abbrev=0 2>$null | sed 's/^v//')" >> $env:GITHUB_OUTPUT
        echo "build_number=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.display_version }}
        body: |
          ## Soldato ${{ steps.version.outputs.display_version }}

          Multi-architecture release with optimized builds for:
          - **x86** (32-bit Windows)
          - **x64** (64-bit Windows)
          - **ARM64** (ARM64 Windows)

          ### Installation
          1. Download the appropriate ZIP file for your architecture
          2. Extract the ZIP file
          3. Run `Soldato.exe`

          ### System Requirements
          - Windows 10 or later
          - No additional dependencies required

          ### Changes
          See the [changelog](https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.display_version }}^...${{ steps.version.outputs.display_version }}) for detailed changes.
        files: |
          artifacts/Soldato-x86/Soldato-${{ steps.version.outputs.display_version }}-x86.zip
          artifacts/Soldato-x64/Soldato-${{ steps.version.outputs.display_version }}-x64.zip
          artifacts/Soldato-arm64/Soldato-${{ steps.version.outputs.display_version }}-arm64.zip
        draft: false
        prerelease: false
