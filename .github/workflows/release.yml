name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: x86
            configuration: Release
            arch: Win32
            runner: windows-latest
          - platform: x64
            configuration: Release
            arch: x64
            runner: windows-latest
          - platform: arm64
            configuration: Release
            arch: ARM64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup Visual Studio
      uses: microsoft/setup-vs@v1
      with:
        vs-version: '17.0'
        components: 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Tools.ARM64 Microsoft.VisualStudio.Component.Windows10SDK.19041'

    - name: Get version from tag
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Build ${{ matrix.platform }}
      run: |
        msbuild Soldato.sln ^
          /p:Configuration=${{ matrix.configuration }} ^
          /p:Platform=${{ matrix.arch }} ^
          /p:PlatformToolset=v143 ^
          /p:WindowsTargetPlatformVersion=10.0 ^
          /m ^
          /v:minimal

    - name: Create release directory
      run: |
        mkdir release-${{ matrix.platform }}
        if "${{ matrix.arch }}" == "Win32" (
          copy "x64\Release\Soldato.exe" "release-${{ matrix.platform }}\Soldato.exe"
        ) else if "${{ matrix.arch }}" == "ARM64" (
          copy "ARM64\${{ matrix.configuration }}\Soldato.exe" "release-${{ matrix.platform }}\Soldato.exe"
        ) else (
          copy "x64\${{ matrix.configuration }}\Soldato.exe" "release-${{ matrix.platform }}\Soldato.exe"
        )
        copy "Soldato\app.ico" "release-${{ matrix.platform }}\app.ico" 2>nul || echo "app.ico not found, skipping"

    - name: Create ZIP archive
      run: |
        powershell Compress-Archive -Path "release-${{ matrix.platform }}\*" -DestinationPath "Soldato-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Soldato-${{ matrix.platform }}
        path: Soldato-${{ steps.get_version.outputs.version }}-${{ matrix.platform }}.zip
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## Soldato ${{ steps.get_version.outputs.version }}

          Multi-architecture release with optimized builds for:
          - **x86** (32-bit Windows)
          - **x64** (64-bit Windows)
          - **ARM64** (ARM64 Windows)

          ### Installation
          1. Download the appropriate ZIP file for your architecture
          2. Extract the ZIP file
          3. Run `Soldato.exe`

          ### System Requirements
          - Windows 10 or later
          - No additional dependencies required

          ### Changes
          See the [changelog](https://github.com/${{ github.repository }}/compare/${{ steps.get_version.outputs.version }}^...${{ steps.get_version.outputs.version }}) for detailed changes.
        files: |
          artifacts/Soldato-x86/Soldato-${{ steps.get_version.outputs.version }}-x86.zip
          artifacts/Soldato-x64/Soldato-${{ steps.get_version.outputs.version }}-x64.zip
          artifacts/Soldato-arm64/Soldato-${{ steps.get_version.outputs.version }}-arm64.zip
        draft: false
        prerelease: false
