name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOLUTION_FILE: Soldato.sln
  PROJECT_FILE: Soldato/Soldato.vcxproj

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - configuration: Debug
            platform: x64
            triplet: x64-windows
          - configuration: Release
            platform: x64
            triplet: x64-windows
          - configuration: Debug
            platform: arm64
            triplet: arm64-windows
          - configuration: Release
            platform: arm64
            triplet: arm64-windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update version with GitHub Actions build number
      id: version
      run: |
        .\scripts\update-version-github.ps1
        echo "version=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
        echo "display_version=$(git describe --tags --abbrev=0 2>$null | sed 's/^v//')" >> $env:GITHUB_OUTPUT
        echo "build_number=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup Windows SDK
      uses: microsoft/setup-msbuild@v2

    - name: Setup Vcpkg
      id: vcpkg # Add ID here
      uses: johnwason/vcpkg-action@v7
      with:
        triplet: ${{ matrix.triplet }}
        manifest-dir: ${{ github.workspace }}
        token: ${{ github.token }}

    - name: Display build environment
      run: |
        echo "Visual Studio version:"
        & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && where cl
        echo "MSBuild version:"
        msbuild /version
        echo "Windows SDK version:"
        reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0" /v ProductVersion

    - name: Restore NuGet packages
      run: nuget restore $env:SOLUTION_FILE
      continue-on-error: true

    - name: Build solution
      run: |
        $vcpkgRoot = "${{ steps.vcpkg.outputs.vcpkg-root }}" # Use output from vcpkg action
        $vcpkgTargetsPath = "$vcpkgRoot\scripts\buildsystems\msbuild\vcpkg.targets"
        Write-Host "VCPKG Targets Path: $vcpkgTargetsPath"
        msbuild $env:SOLUTION_FILE `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:UseMultiToolTask=true `
          /p:EnforceProcessCountAcrossBuilds=true `
          /m `
          /verbosity:minimal `
          "/flp:logfile=build-${{ matrix.configuration }}-${{ matrix.platform }}.log;verbosity=detailed" `
          "/p:ForceImportBeforeCppTargets=$vcpkgTargetsPath"
        if ($LASTEXITCODE -ne 0) {
          echo "Build failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

    - name: Verify executable
      run: |
        echo "Looking for executable in various possible locations..."

        # Check multiple possible output paths
        $possiblePaths = @(
          "${{ matrix.configuration }}/Soldato.exe",
          "Soldato/${{ matrix.configuration }}/Soldato.exe",
          "${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.exe",
          "Soldato/${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.exe",
          "x64/${{ matrix.configuration }}/Soldato.exe",
          "arm64/${{ matrix.configuration }}/Soldato.exe",
          "ARM64/${{ matrix.configuration }}/Soldato.exe"
        )

        $exePath = $null
        foreach ($path in $possiblePaths) {
          echo "Checking: $path"
          if (Test-Path $path) {
            $exePath = $path
            echo "✓ Found executable at: $exePath"
            break
          }
        }

        if ($exePath) {
          $fileInfo = Get-Item $exePath
          echo "File size: $($fileInfo.Length) bytes"
          echo "Last modified: $($fileInfo.LastWriteTime)"

          # Basic executable validation
          try {
            $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath)
            echo "Product name: $($versionInfo.ProductName)"
            echo "File version: $($versionInfo.FileVersion)"
          } catch {
            echo "Could not read version info (this is normal for debug builds)"
          }
        } else {
          echo "✗ Build failed: Soldato.exe not found in any expected location"
          echo "Listing directory contents:"
          Get-ChildItem -Recurse -Name "*.exe" | ForEach-Object { echo "  $_" }
          exit 1
        }

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ matrix.configuration }}-${{ matrix.platform }}
        path: build-*.log
        retention-days: 7

    - name: Upload executable (main branch only)
      uses: actions/upload-artifact@v4
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      with:
        name: Soldato-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          ${{ matrix.configuration }}/Soldato.exe
          ${{ matrix.configuration }}/Soldato.pdb
          Soldato/${{ matrix.configuration }}/Soldato.exe
          Soldato/${{ matrix.configuration }}/Soldato.pdb
          ${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.exe
          ${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.pdb
          arm64/${{ matrix.configuration }}/Soldato.exe
          arm64/${{ matrix.configuration }}/Soldato.pdb
          ARM64/${{ matrix.configuration }}/Soldato.exe
          ARM64/${{ matrix.configuration }}/Soldato.pdb
        retention-days: 30
        if-no-files-found: warn