name: Build with MSVC

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages (if any)
      run: nuget restore Soldato.sln
      continue-on-error: true

    - name: Build solution
      run: |
        msbuild Soldato.sln `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:PlatformToolset=v143 `
          /p:WindowsTargetPlatformVersion=10.0 `
          /m `
          /verbosity:minimal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Soldato-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          ${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.exe
          ${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.pdb
        retention-days: 30
        if-no-files-found: warn

    - name: List build outputs
      run: |
        echo "Build completed for ${{ matrix.configuration }} ${{ matrix.platform }}"
        if (Test-Path "${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.exe") {
          echo "✓ Soldato.exe found"
          Get-Item "${{ matrix.platform }}/${{ matrix.configuration }}/Soldato.exe" | Select-Object Name, Length, LastWriteTime
        } else {
          echo "✗ Soldato.exe not found"
        }
